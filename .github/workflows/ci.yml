name: CI

on:
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt update && sudo apt install -y build-essential

      - name: Compile and run gemmtr tests
        run: |
          cd gemmtr_BLAS
          g++ -o test_gemmtr test.cpp gemmtr.cpp
          ./test_gemmtr